name: Probe NSE index site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run probe and save result
        shell: bash
        run: |
          set +e
          python scripts/probe_niftyindices.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indices/_probe_result.txt
          git commit -m "NSE index probe result"
          git pull --rebase
          git push
